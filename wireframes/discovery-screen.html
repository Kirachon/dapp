<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DApp - Discovery Screen Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            padding: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 32px;
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px 20px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #007AFF;
        }

        .header-icons {
            display: flex;
            gap: 16px;
        }

        .icon {
            width: 24px;
            height: 24px;
            border: 2px solid #8E8E93;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #8E8E93;
        }

        .card-stack {
            position: absolute;
            top: 120px;
            left: 20px;
            right: 20px;
            bottom: 140px;
        }

        .profile-card {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.7) 100%), 
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 500"><rect width="335" height="500" fill="%23f0f0f0"/><text x="50%" y="40%" text-anchor="middle" fill="%23999" font-size="16">Profile Photo</text><text x="50%" y="45%" text-anchor="middle" fill="%23999" font-size="12">Sarah, 28</text></svg>');
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .card-behind {
            position: absolute;
            top: 8px;
            left: 4px;
            right: -4px;
            bottom: -8px;
            background: #ddd;
            border-radius: 16px;
            z-index: -1;
            transform: rotate(1deg);
        }

        .profile-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            color: white;
        }

        .profile-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .profile-details {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .profile-bio {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.4;
        }

        .photo-indicators {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
        }

        .photo-dot {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.4);
            border-radius: 2px;
        }

        .photo-dot.active {
            background: white;
        }

        .action-buttons {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 0 20px;
        }

        .action-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .btn-pass {
            background: #8E8E93;
            color: white;
        }

        .btn-super {
            background: #007AFF;
            color: white;
        }

        .btn-like {
            background: #FF2D92;
            color: white;
        }

        .swipe-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .see-more {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="screen">
            <div class="header">
                <div class="logo">DApp</div>
                <div class="header-icons">
                    <div class="icon">🔔</div>
                    <div class="icon">⚙️</div>
                </div>
            </div>

            <div class="card-stack">
                <div class="card-behind"></div>
                <div class="profile-card">
                    <div class="photo-indicators">
                        <div class="photo-dot active"></div>
                        <div class="photo-dot"></div>
                        <div class="photo-dot"></div>
                        <div class="photo-dot"></div>
                    </div>
                    
                    <button class="see-more">See More</button>
                    
                    <div class="profile-info">
                        <div class="profile-name">Sarah</div>
                        <div class="profile-details">28 • 2 miles away</div>
                        <div class="profile-bio">Love hiking and trying new coffee shops! Looking for someone who shares my passion for adventure...</div>
                    </div>
                    
                    <div class="swipe-hint">← Swipe to decide →</div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn btn-pass">✕</button>
                <button class="action-btn btn-super">★</button>
                <button class="action-btn btn-like">♥</button>
            </div>
        </div>
    </div>
</body>
</html>
