<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DApp - Match Celebration & Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            padding: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 32px;
            position: relative;
            overflow: hidden;
        }

        .match-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, #FF2D92, #007AFF);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .match-title {
            font-size: 32px;
            font-weight: bold;
            color: white;
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            animation: bounce 1s ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 60%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            80% { transform: translateY(-10px); }
        }

        .profile-photos {
            display: flex;
            gap: 20px;
            margin-bottom: 60px;
            position: relative;
        }

        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: scaleIn 0.8s ease-out;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .heart-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            animation: heartPulse 2s ease-in-out infinite;
        }

        @keyframes heartPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        .match-actions {
            display: flex;
            gap: 16px;
        }

        .match-btn {
            padding: 16px 32px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .match-btn:hover {
            transform: scale(1.05);
        }

        .btn-message {
            background: white;
            color: #007AFF;
        }

        .btn-keep-swiping {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }

        .chat-interface {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            display: none;
            flex-direction: column;
            animation: slideLeft 0.3s ease-out;
        }

        .chat-interface.active {
            display: flex;
        }

        @keyframes slideLeft {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .chat-header {
            background: #fff;
            padding: 60px 20px 16px;
            border-bottom: 1px solid #E5E5E7;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            font-size: 18px;
            cursor: pointer;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #999;
        }

        .chat-user-info h3 {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .chat-user-info p {
            font-size: 14px;
            color: #8E8E93;
        }

        .menu-btn {
            margin-left: auto;
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            font-size: 18px;
            cursor: pointer;
        }

        .conversation-starters {
            padding: 20px;
            background: #F2F2F7;
            border-bottom: 1px solid #E5E5E7;
        }

        .starters-title {
            font-size: 14px;
            color: #8E8E93;
            margin-bottom: 12px;
        }

        .starter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .starter-chip {
            background: #007AFF;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .starter-chip:hover {
            opacity: 0.8;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-group.sent {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.4;
        }

        .message-bubble.sent {
            background: #007AFF;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-bubble.received {
            background: #E5E5E7;
            color: #000;
            border-bottom-left-radius: 4px;
        }

        .message-status {
            font-size: 12px;
            color: #8E8E93;
            margin-top: 4px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8E8E93;
            font-size: 14px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8E8E93;
            animation: typingDot 1.5s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingDot {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        .chat-input {
            background: #fff;
            border-top: 1px solid #E5E5E7;
            padding: 12px 20px 34px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-container {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            min-height: 40px;
            max-height: 120px;
            padding: 10px 16px;
            border: 1px solid #E5E5E7;
            border-radius: 20px;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .attach-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #007AFF;
            color: white;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .send-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="screen">
            <!-- Match Celebration Modal -->
            <div class="match-modal" id="matchModal">
                <h1 class="match-title">It's a Match! 🎉</h1>
                
                <div class="profile-photos">
                    <div class="profile-photo">Your Photo</div>
                    <div class="profile-photo">Sarah's Photo</div>
                    <div class="heart-animation">💖</div>
                </div>

                <div class="match-actions">
                    <button class="match-btn btn-message" onclick="showChat()">Send Message</button>
                    <button class="match-btn btn-keep-swiping">Keep Swiping</button>
                </div>
            </div>

            <!-- Chat Interface -->
            <div class="chat-interface" id="chatInterface">
                <div class="chat-header">
                    <button class="back-btn" onclick="showMatch()">←</button>
                    <div class="chat-avatar">Sarah</div>
                    <div class="chat-user-info">
                        <h3>Sarah</h3>
                        <p>Active 2 hours ago</p>
                    </div>
                    <button class="menu-btn">⋯</button>
                </div>

                <div class="conversation-starters">
                    <p class="starters-title">Start your conversation</p>
                    <div class="starter-chips">
                        <button class="starter-chip">Ask about hiking 🥾</button>
                        <button class="starter-chip">Comment on photo 📸</button>
                        <button class="starter-chip">Ask a question ❓</button>
                    </div>
                </div>

                <div class="chat-messages">
                    <div class="message-group sent">
                        <div class="message-bubble sent">Hey! I saw you love hiking too. What's your favorite trail?</div>
                        <div class="message-status">Delivered</div>
                    </div>

                    <div class="message-group">
                        <div class="message-bubble received">Hi! Yes! I love the trails up in Marin. Have you been to Mount Tam?</div>
                    </div>

                    <div class="typing-indicator">
                        <div class="chat-avatar">S</div>
                        <span>Sarah is typing</span>
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>

                <div class="chat-input">
                    <button class="attach-btn">📎</button>
                    <div class="input-container">
                        <textarea class="message-input" placeholder="Type a message..." rows="1"></textarea>
                    </div>
                    <button class="send-btn">→</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showChat() {
            document.getElementById('matchModal').style.display = 'none';
            document.getElementById('chatInterface').classList.add('active');
        }

        function showMatch() {
            document.getElementById('matchModal').style.display = 'flex';
            document.getElementById('chatInterface').classList.remove('active');
        }

        // Auto-resize textarea
        const textarea = document.querySelector('.message-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
    </script>
</body>
</html>
