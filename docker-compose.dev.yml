# Docker Compose for LoveConnect Development
# Optimized for Windows compatibility and file permission issues

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgis/postgis:16-3.4
    container_name: loveconnect-postgres
    environment:
      POSTGRES_DB: dating
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - '5433:5432'
    networks:
      - loveconnect-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d dating']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis for Session Storage
  redis:
    image: redis:7-alpine
    container_name: loveconnect-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    networks:
      - loveconnect-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # SuperTokens Authentication Service
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: loveconnect-supertokens
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3567:3567'
    environment:
      POSTGRESQL_CONNECTION_URI: 'postgresql://app:app@loveconnect-postgres:5432/dating'
      POSTGRESQL_TABLE_NAMES_PREFIX: 'st_'
      SUPERTOKENS_PORT: '3567'
    networks:
      - loveconnect-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3567/hello']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: loveconnect-minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - loveconnect-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # MailHog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: loveconnect-mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    networks:
      - loveconnect-network
    restart: unless-stopped

  # Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: loveconnect-api
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://app:app@loveconnect-postgres:5432/dating
      - SUPERTOKENS_CONNECTION_URI=http://loveconnect-supertokens:3567
      - REDIS_URL=redis://loveconnect-redis:6379
      - MINIO_ENDPOINT=loveconnect-minio:9000
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
      - SMTP_HOST=loveconnect-mailhog
      - SMTP_PORT=1025
      - PORT=8080
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:8080
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      supertokens:
        condition: service_started
    networks:
      - loveconnect-network
    restart: unless-stopped
    volumes:
      # Only mount essential files to avoid Windows permission issues
      - ./src:/app/src:cached
      - ./prisma:/app/prisma:cached
      - ./tsconfig.api.json:/app/tsconfig.api.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - /app/node_modules

  # Frontend Next.js Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: loveconnect-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/graphql
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/graphql
      - NEXT_PUBLIC_WEB_DOMAIN=http://localhost:3000
      - NEXT_PUBLIC_API_DOMAIN=http://localhost:8080
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - '3000:3000'
    depends_on:
      - api
    networks:
      - loveconnect-network
    restart: unless-stopped
    volumes:
      # Only mount essential files to avoid Windows permission issues
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - /app/node_modules
      - /app/.next

  # Development tools container for file operations
  dev-tools:
    image: node:18-alpine
    container_name: loveconnect-dev-tools
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - loveconnect-network
    command: tail -f /dev/null
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  loveconnect-network:
    driver: bridge
