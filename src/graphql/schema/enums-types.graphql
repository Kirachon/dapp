scalar DateTime

enum SwipeDirection { LEFT RIGHT SUPER }
enum MatchStatus { ACTIVE UNMATCHED BLOCKED }
enum ProfileVisibility { PUBLIC PRIVATE MATCHES_ONLY }

# Admin enums
enum UserStatus { ACTIVE BANNED PENDING SUSPENDED }
enum ModerationStatus { PENDING APPROVED REJECTED }
enum ModerationPriority { LOW MEDIUM HIGH URGENT }
enum ReportStatus { PENDING REVIEWED RESOLVED DISMISSED }

type FeatureFlag {
  key: String!
  name: String!
  description: String
  enabled: Boolean!
  targetAudience: String!
  rolloutPercentage: Int!
}

type EmailTemplate {
  key: String!
  name: String!
  subject: String!
  htmlContent: String!
  textContent: String
  variables: [String!]!
  category: String!
  enabled: Boolean!
}

type AppConfig {
  key: String!
  value: String!
  description: String
  category: String!
  isPublic: Boolean!
}

type ActivationData {
  welcomeSequenceStarted: Boolean!
  welcomeSequenceCompleted: Boolean!
  currentWelcomeStep: Int!
  activationScore: Int!
  activationFactors: [String!]!
  engagementMetrics: ActivationEngagement!
  milestones: ActivationMilestones!
  preferences: ActivationPreferences!
}

type ActivationEngagement {
  loginFrequency: Int!
  featureUsage: [String!]!
  timeSpent: Int!
  goalsSet: Int!
  goalsCompleted: Int!
}

type ActivationMilestones {
  firstLogin: String!
  profileCompleted: String
  firstGoalSet: String
  weeklyActive: Boolean!
}

type ActivationPreferences {
  welcomeEmails: Boolean!
  inAppMessages: Boolean!
  achievementNotifications: Boolean!
}

type OnboardingData {
  currentStep: Int!
  completedSteps: [Int!]!
  totalSteps: Int!
  completionPercentage: Int!
  steps: JSON!
  analytics: OnboardingAnalytics!
}

type OnboardingAnalytics {
  startedAt: String!
  lastActiveAt: String!
  timeSpent: Int!
  completionRate: Int!
}

scalar JSON



type ContentPage {
  slug: String!
  title: String!
  content: String!
  metaDescription: String
  published: Boolean!
}

type ContentCategory {
  key: String!
  name: String!
  description: String
}

type Me {
  id: ID!
  email: String!
  roles: [String!]!
  profile: MeProfile
}

type MeProfile {
  id: ID!
  name: String!
  isAdmin: Boolean!
}

type Profile {
  userId: ID!
  name: String!
  age: Int!
  gender: String
  orientation: String
  bio: String
  interests: [String!]!
  lifestyle: String
  education: String
  photos: [String!]!
  videoIntroUrl: String
  prompts: [String!]!
  visibility: ProfileVisibility!
}

input ProfileInput {
  name: String!
  age: Int!
  gender: String
  orientation: String
  bio: String
  interests: [String!]
  lifestyle: String
  education: String
  photos: [String!]
  videoIntroUrl: String
  prompts: [String!]
  visibility: ProfileVisibility
}

type Preferences {
  userId: ID!
  minAge: Int!
  maxAge: Int!
  distanceKm: Int!
  showMe: String
}

input PreferencesInput {
  minAge: Int
  maxAge: Int
  distanceKm: Int
  showMe: String
}

type MatchView {
  id: ID!
  status: MatchStatus!
  createdAt: DateTime!
  otherUser: Profile!
}

type ConversationView {
  id: ID!
  matchId: ID!
  lastMessageAt: DateTime
  otherUser: Profile!
  unreadCount: Int!
}

type Message {
  id: ID!
  conversationId: ID!
  senderId: ID!
  type: String!
  content: String
  mediaUrls: [String!]!
  createdAt: DateTime!
  readAt: DateTime
}

type SwipeResult { ok: Boolean!, matched: Boolean!, matchId: ID }

type MeResult { ok: Boolean!, error: String, user: Me }

# Admin types
type AdminStats {
  totalUsers: Int!
  activeUsers: Int!
  totalMatches: Int!
  pendingReports: Int!
  pendingPhotos: Int!
  revenue: Float!
  newUsersToday: Int!
  newUsersThisWeek: Int!
  newUsersThisMonth: Int!
}

type AdminUser {
  id: ID!
  email: String!
  profile: Profile
  status: UserStatus!
  createdAt: DateTime!
  lastActiveAt: DateTime
  reportCount: Int!
  verified: Boolean!
  roles: [String!]!
}

type AdminUsersResult {
  users: [AdminUser!]!
  totalCount: Int!
  hasMore: Boolean!
}

type AdminModerationItem {
  id: ID!
  type: String!
  user: AdminUser!
  content: String!
  reason: String!
  priority: ModerationPriority!
  status: ModerationStatus!
  submittedAt: DateTime!
  reportedBy: String
  reviewedAt: DateTime
  reviewedBy: String
}

type AdminModerationResult {
  items: [AdminModerationItem!]!
  totalCount: Int!
  hasMore: Boolean!
}

type AdminReport {
  id: ID!
  reportedUser: AdminUser!
  reportedBy: AdminUser!
  reason: String!
  description: String
  status: ReportStatus!
  priority: ModerationPriority!
  createdAt: DateTime!
  reviewedAt: DateTime
  reviewedBy: String
}

type AdminReportsResult {
  reports: [AdminReport!]!
  totalCount: Int!
  hasMore: Boolean!
}

