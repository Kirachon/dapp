name: E2E Advanced Auth

on:
  workflow_dispatch:
  push:
    branches: [feature/**, production-ready, main]
    paths:
      - 'frontend/tests/auth-advanced.spec.ts'
      - 'frontend/playwright.config.ts'
      - '.github/workflows/e2e-auth.yml'
      - 'docker-compose.yml'
      - 'src/**'

jobs:
  e2e-auth:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: write
      deployments: none

    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Start services via Docker Compose (infra)
        run: |
          docker compose up -d postgres redis supertokens minio mailhog
          docker ps -a
      - name: Create .env for API
        run: |
          cp .env.docker .env
      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy
      - name: Start Backend+Frontend (dev)
        run: |
          node frontend/scripts/dev-both.js &
          echo $! > devboth.pid
        env:
          NODE_ENV: development
      - name: Wait for API and Frontend
        run: |
          for i in {1..60}; do
            (curl -sSf http://localhost:8080/health >/dev/null 2>&1) && break
            sleep 1
          done
          for i in {1..60}; do
            (curl -sSf http://localhost:3000/ >/dev/null 2>&1) && break
            sleep 1
          done

      - name: Wait for API (8080)
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:8080/graphql -X POST -H 'content-type: application/json' --data '{"query":"{__typename}"}' >/dev/null; then
              echo "API is ready"; exit 0; fi; sleep 2; done; exit 1

      - name: Wait for Frontend (3000)
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:3000 >/dev/null; then echo "Frontend ready"; exit 0; fi; sleep 2; done; exit 1

      - name: Run Playwright (advanced auth only)
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: 'true'
        run: |
          npx playwright test tests/auth-advanced.spec.ts --project=chromium --reporter=html,line
      - name: Teardown
        if: always()
        run: |
          if [ -f devboth.pid ]; then kill $(cat devboth.pid) || true; fi
          docker compose logs --no-color > docker-infra.log 2>&1 || true
          docker compose down || true

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
