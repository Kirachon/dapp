name: Security Scanning

on:
  push:
    branches: [production-ready, main]
  pull_request:
    branches: [production-ready]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Run npm audit (backend)
        run: |
          npm audit --audit-level=moderate --production
          npm audit --audit-level=high --production || exit 1

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: |
          npm audit --audit-level=moderate --production
          npm audit --audit-level=high --production || exit 1

      - name: Check for known vulnerabilities
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  code-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  docker-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dating-app:security-scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dating-app:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  security-headers-check:
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Start test server
        run: |
          npm ci
          npm run dev &
          sleep 30

      - name: Check security headers
        run: |
          # Check for security headers
          curl -I http://localhost:8080/health | grep -i "x-frame-options\|x-content-type-options\|x-xss-protection\|strict-transport-security"

          # Check CORS configuration
          curl -H "Origin: https://malicious.com" -I http://localhost:8080/graphql

      - name: Stop test server
        run: pkill -f "npm run dev" || true

  env-file-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if .env files are committed (except .env.example)
        run: |
          set -e
          echo "Scanning repository for committed .env files..."
          disallowed=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v -E '\.env\.example$' || true)
          if [ -n "$disallowed" ]; then
            echo "Found committed environment files (not allowed):"
            echo "$disallowed"
            exit 1
          fi
          echo "No committed .env files found."

  security-report:
    runs-on: ubuntu-latest
    needs:
      [
        dependency-scan,
        code-security-scan,
        docker-security-scan,
        secrets-scan,
        security-headers-check,
        env-file-guard,
      ]
    if: always()
    steps:
      - name: Generate security report
        run: |
          echo "# Security Scan Report" > security-report.md
          echo "Date: $(date)" >> security-report.md
          echo "" >> security-report.md
          echo "## Scan Results" >> security-report.md
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> security-report.md
          echo "- Code Security Scan: ${{ needs.code-security-scan.result }}" >> security-report.md
          echo "- Docker Security Scan: ${{ needs.docker-security-scan.result }}" >> security-report.md
          echo "- Secrets Scan: ${{ needs.secrets-scan.result }}" >> security-report.md
          echo "- Security Headers Check: ${{ needs.security-headers-check.result }}" >> security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.sha }}
          path: security-report.md
