name: Unit & Data Validation

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: dating
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U app" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5433/dating?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run unit tests
        run: npm test -- --ci
      - name: Seed database
        run: npm run db:seed
      - name: Validate data consistency
        run: node scripts/validate-data.js
