# monitoring/promtail-config.yml
# Purpose: Promtail config to scrape Docker containers (WSL2) and push to Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_datingapp_env']
        target_label: env
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            time: time
        # If logs are not JSON, they will pass through unchanged.
      - labels:
          level:
          service:
          env:
      - timestamp:
          source: time
          format: RFC3339
      - output:
          source: msg

