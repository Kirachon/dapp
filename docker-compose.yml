services:
  api:
    build: .
    container_name: app-api
    env_file: .env.docker
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio
      - mailhog
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: app-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/graphql
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgis/postgis:16-3.4
    container_name: app-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dating}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: app-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: app-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: app-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: app-supertokens
    depends_on:
      - postgres
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://app:app@app-postgres:5432/dating"
      POSTGRESQL_TABLE_NAMES_PREFIX: "st_"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:

networks:
  app-network:
    driver: bridge

